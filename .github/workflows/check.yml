name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails on a schema error in content/profile.json before anything else.
      - name: Build
        run: npm run build

      - name: Validate HTML
        run: npm run lint:html

      # Catches a renamed repo or a dead credential URL before a recruiter does.
      - name: Check links
        run: npm run lint:links
